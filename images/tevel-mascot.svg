<svg viewBox="0 0 400 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="דמות מצוירת של ינשוף חמוד וסקרן עם כובע בוגר, מנגן בגיטרה בשתי הכנפיים - הדמות המארחת של תבל">
  <defs>
    <radialGradient id="featherGrad" cx="35%" cy="28%" r="80%">
      <stop offset="0%" stop-color="#EBD5AC"/>
      <stop offset="100%" stop-color="#D3AE7C"/>
    </radialGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="200" cy="420" rx="110" ry="16" fill="#55506A" opacity="0.08"/>

  <!-- feet -->
  <ellipse cx="165" cy="404" rx="24" ry="13" fill="#E4C878"/>
  <ellipse cx="235" cy="404" rx="24" ry="13" fill="#E4C878"/>

  <!-- body (egg-shaped owl silhouette) -->
  <path d="M200 78 C300 78 336 168 326 258 C318 340 268 402 200 402 C132 402 82 340 74 258 C64 168 100 78 200 78 Z" fill="url(#featherGrad)"/>

  <!-- ear tufts -->
  <path d="M132 96 q-14-34 6-46 q18 22 14 50z" fill="#C9955F"/>
  <path d="M268 96 q14-34-6-46 q-18 22-14 50z" fill="#C9955F"/>

  <!-- belly -->
  <ellipse cx="200" cy="288" rx="82" ry="74" fill="#FBF6EC"/>

  <!-- world/globe patch on belly -->
  <circle cx="200" cy="278" r="34" fill="#C6DDB4"/>
  <path d="M172 266c10-6 22-8 28-4 8 5-2 10-10 8-6-2-14 0-18 4z" fill="#A8CB90"/>
  <path d="M206 298c8-4 20-2 24 4 4 6-8 8-16 4-6-3-10-4-8-8z" fill="#A8CB90"/>
  <ellipse cx="200" cy="278" rx="34" ry="34" fill="none" stroke="#A8CB90" stroke-width="3" opacity="0.5"/>
  <path d="M166 278 h68 M200 244 v68" stroke="#A8CB90" stroke-width="2" opacity="0.35"/>

  <!-- guitar (held low, in front of the belly, well below the face) -->
  <g transform="translate(215,325) rotate(14)">
    <rect x="-9" y="-65" width="18" height="78" rx="6" fill="#E4C878"/>
    <circle cx="0" cy="35" r="44" fill="#F6E2A8"/>
    <circle cx="0" cy="35" r="44" fill="none" stroke="#E4C878" stroke-width="6"/>
    <circle cx="0" cy="35" r="15" fill="#B9A4D4"/>
    <line x1="0" y1="-65" x2="0" y2="20" stroke="#B9A4D4" stroke-width="2"/>
  </g>

  <!-- wings holding the guitar -->
  <path d="M96 255 Q150 258 198 266" stroke="#D3AE7C" stroke-width="24" fill="none" stroke-linecap="round"/>
  <ellipse cx="198" cy="266" rx="15" ry="10" fill="#D3AE7C" transform="rotate(-8 198 266)"/>
  <path d="M304 255 Q290 305 245 345" stroke="#D3AE7C" stroke-width="24" fill="none" stroke-linecap="round"/>
  <ellipse cx="245" cy="345" rx="15" ry="10" fill="#D3AE7C" transform="rotate(30 245 345)"/>

  <!-- facial disc -->
  <ellipse cx="200" cy="188" rx="80" ry="66" fill="#F2E4C6" opacity="0.9"/>

  <!-- eyebrow tufts for curious expression -->
  <path d="M138 138 q20-14 40-4" stroke="#C9955F" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M262 134 q-18-10-36 2" stroke="#C9955F" stroke-width="6" fill="none" stroke-linecap="round"/>

  <!-- eyes -->
  <circle cx="164" cy="178" r="34" fill="#FFFEFA"/>
  <circle cx="236" cy="172" r="30" fill="#FFFEFA"/>
  <circle cx="168" cy="182" r="16" fill="#55506A"/>
  <circle cx="238" cy="174" r="13" fill="#55506A"/>
  <circle cx="174" cy="175" r="4.5" fill="#FFFEFA"/>
  <circle cx="242" cy="168" r="4" fill="#FFFEFA"/>

  <!-- cheeks -->
  <circle cx="134" cy="216" r="13" fill="#EFB0AA" opacity="0.5"/>
  <circle cx="266" cy="212" r="13" fill="#EFB0AA" opacity="0.5"/>

  <!-- beak -->
  <path d="M192 208 q8 16 0 26 q-8-10 0-26z" fill="#E3AF77"/>

  <!-- graduation cap -->
  <g>
    <path d="M120 92 L200 62 L280 92 L200 118 Z" fill="#B9A4D4"/>
    <path d="M200 118 L200 96 L242 82 L242 108 Z" fill="#A489C9" opacity="0.6"/>
    <circle cx="200" cy="90" r="6" fill="#E4C878"/>
    <path d="M200 90 q34 6 30 40" stroke="#E4C878" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="230" cy="130" r="6" fill="#E4C878"/>
  </g>

  <!-- musical notes -->
  <g fill="#B7DCE8">
    <circle cx="340" cy="150" r="10"/>
    <rect x="348" y="100" width="5" height="52"/>
    <circle cx="60" cy="330" r="9" fill="#EFB0AA"/>
    <rect x="67" y="286" width="4" height="46" fill="#EFB0AA"/>
  </g>
</svg>
